[project]
name = "sre-agent"
version = "0.1.0"
description = "Runnable sketch of an SRE agent core loop."
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2",
    "ipykernel",
    "ipywidgets",
    "tqdm",
    "jsonschema>=4.26.0",
    "mlx-lm>=0.31.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]
artifacts = ["src/sre_agent/prompts/*.md", "src/sre_agent/data/*.md"]
